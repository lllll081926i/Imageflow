name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to upload cloud-built packages, for example v2.1.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
            python_architecture: x64
            system: windows
          - platform: windows-arm64
            runner: windows-11-arm
            python_architecture: arm64
            system: windows
          - platform: macos-amd64
            runner: macos-15-intel
            python_architecture: x64
            system: macos
          - platform: macos-arm64
            runner: macos-15
            python_architecture: arm64
            system: macos
          - platform: linux-amd64
            runner: ubuntu-24.04
            python_architecture: x64
            system: linux
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python_architecture: arm64
            system: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Linux desktop build dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgtk-3-0t64 libwebkit2gtk-4.1-0 pkg-config python3-dev rpm

      - name: Sync Python deps
        run: uv sync --group build

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Python tests
        # backend/tests/engines is a package, so a single discover covers API + engines.
        run: uv run python -m unittest discover -s backend/tests -v

      - name: Run Python engine tests
        # Keep an explicit engines-only step for targeted CI signal.
        run: uv run python -m unittest discover -s backend/tests/engines -v

      - name: Compile Python sources
        run: uv run python -m compileall backend

      - name: Check diff whitespace
        run: git diff --check

      - name: Setup Inno Setup 6
        if: matrix.system == 'windows' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\Inno Setup 6"

      - name: Build native release packages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: npm run build:release

      - name: Upload native packages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: imageflow-release-${{ matrix.platform }}
          path: |
            artifacts/release/ImageFlow-portable-*.zip
            artifacts/release/ImageFlow-portable-*.tar.gz
            artifacts/release/ImageFlow-portable-*.AppImage
            artifacts/release/ImageFlow-setup-*.exe
            artifacts/release/ImageFlow-setup-*.pkg
            artifacts/release/ImageFlow-setup-*.deb
            artifacts/release/ImageFlow-setup-*.rpm
            artifacts/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all native packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: imageflow-release-*
          merge-multiple: true
          path: artifacts/release

      - name: Verify complete release asset set
        shell: bash
        working-directory: artifacts/release
        run: |
          shopt -s nullglob
          assets=(*.zip *.tar.gz *.AppImage *.exe *.pkg *.deb *.rpm SHA256SUMS-*.txt)
          if [ "${#assets[@]}" -ne 22 ]; then
            echo "Expected 22 release assets, found ${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          sha256sum --check SHA256SUMS-*.txt

      - name: Create draft and upload release assets
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ImageFlow ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          draft: true
          overwrite_files: true
          body: |
            ## 下载与更新

            本版本同时提供 Windows、macOS、Linux 的 x64 与 ARM64 原生安装版、便携版，以及逐平台 SHA-256 校验清单。Linux 同时提供 DEB、RPM 与 AppImage。

            - 安装版用户可以在 ImageFlow 设置页确认后自动下载并启动安装；下载会继承系统或环境中的本地代理配置，并在执行前校验文件大小和 SHA-256。
            - 便携版用户点击更新后会打开本 Release 页面，请下载与系统和架构匹配的便携包并手动替换。
            - 安装后的应用名称始终为 ImageFlow，版本与作者信息写入系统包元数据。

            ## 选择正确的文件

            | 系统 | 架构 | 安装版 | 便携版 |
            | --- | --- | --- | --- |
            | Windows | x64 | `windows-amd64.exe` | `windows-amd64.zip` |
            | Windows | ARM64 | `windows-arm64.exe` | `windows-arm64.zip` |
            | macOS Intel | x64 | `macos-amd64.pkg` | `macos-amd64.zip` |
            | macOS Apple Silicon | ARM64 | `macos-arm64.pkg` | `macos-arm64.zip` |
            | Linux | x64 | `linux-amd64.deb` 或 `linux-amd64.rpm` | `linux-amd64.AppImage` 或 `linux-amd64.tar.gz` |
            | Linux | ARM64 | `linux-arm64.deb` 或 `linux-arm64.rpm` | `linux-arm64.AppImage` 或 `linux-arm64.tar.gz` |
          files: |
            artifacts/release/ImageFlow-portable-*.zip
            artifacts/release/ImageFlow-portable-*.tar.gz
            artifacts/release/ImageFlow-portable-*.AppImage
            artifacts/release/ImageFlow-setup-*.exe
            artifacts/release/ImageFlow-setup-*.pkg
            artifacts/release/ImageFlow-setup-*.deb
            artifacts/release/ImageFlow-setup-*.rpm
            artifacts/release/SHA256SUMS-*.txt

      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
